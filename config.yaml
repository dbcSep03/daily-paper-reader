  intent_profiles:
    - tag: agentic-rl
      description: 关注强化学习、中期训练、预训练、协作智能体与智能体数据相关文章。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: mid-training data
          keyword_cn: 中期训练数据
          query: mid-training data and schedules for large language models
        - keyword: agentic data
          keyword_cn: 智能体数据
          query: agentic data construction and curation for training AI agents
        - keyword: cowork agents
          keyword_cn: 协作智能体
          query: cowork agents that collaborate with humans and other agents
        - keyword: pretraining data
          keyword_cn: 预训练数据
          query: pretraining data selection and mixture for language models
        - keyword: multi-turn reinforcement learning
          keyword_cn: 多轮强化学习
          query: reinforcement learning over sequential multi-turn interactions between agents and environments
        - keyword: on-policy distillation
          keyword_cn: 在线策略蒸馏
          query: >-
            on-policy distillation methods that train student agents using trajectories generated by their current
            policy
      intent_queries:
        - query: Approaches to mid training and pretraining data for agentic models
          query_cn: 面向智能体模型的中期训练和预训练数据方法
          enabled: true
          source: manual
          note: ''
        - query: Designing cowork agents and agentic data pipelines for collaborative AI systems
          query_cn: 为协作式AI系统设计协作智能体和智能体数据流水线
          enabled: true
          source: manual
          note: ''
        - query: How reinforcement learning, pretraining, and mid training combine for agentic data training
          query_cn: 强化学习、预训练和中期训练如何结合用于智能体数据训练
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find methods that train language model agents with reinforcement learning over multi turn interactions and
            tool use.
          query_cn: 查找通过多轮交互和工具使用对语言模型智能体进行强化学习训练的方法。
          enabled: true
